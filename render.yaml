# Configuración para publicar GRATIS en Render (https://render.com) con "Blueprint".
# - plan free: sin costo. Se "duerme" tras 15 min sin uso y tarda ~1 min en despertar.
# - Las cuentas de los jugadores se guardan en una base de datos PostgreSQL
#   gratuita (Neon), porque el plan free borra sus archivos al dormirse.
services:
  - type: web
    name: pictionary-online
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL    # dirección de la base de datos de Neon (ver DESPLIEGUE.md, paso 1)
        sync: false
      - key: ICE_SERVERS     # servidor TURN para la voz con datos móviles (opcional, paso 4)
        sync: false
